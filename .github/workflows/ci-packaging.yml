name: CI packaging

# The two slow checks of what ships, apart from the quality gate (ci.yml): the Microsoft Store flavor + package and
# the third-party notices. Their causes are few (dependencies, licenses, packaging files, the code the Store flavor
# leaves out), so they run when those change, and on request (`gh workflow run "CI packaging" --ref <branch>`). Every
# release and hotfix bumps the version in the Cargo + npm files listed here, so each one runs them before its tag.

on:
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
    paths:
      - "app/package-lock.json"
      - "app/src-tauri/Cargo.toml"
      - "app/src-tauri/Cargo.lock"
      - "app/src-tauri/crates/**/Cargo.toml"
      - "app/src-tauri/about.toml"
      - "app/src-tauri/about.hbs"
      - "app/src-tauri/tauri*.conf.json"
      - "app/src-tauri/msstore/**"
      - "app/src-tauri/crates/shell-ext/**"
      - "app/src-tauri/crates/plugins/updates/**"
      - "app/src-tauri/crates/plugins/shell-integration/**"
      - "app/src-tauri/src/lib.rs"
      - "app/src-tauri/src/plugins.rs"
      - "app/src-tauri/src/shell.rs"
      - "app/scripts/third-party-notices.mjs"
      - "scripts/build-msix.ps1"
      - "scripts/get-cargo-about.sh"
      - ".github/workflows/ci-packaging.yml"
  pull_request:
    paths:
      - "app/package-lock.json"
      - "app/src-tauri/Cargo.toml"
      - "app/src-tauri/Cargo.lock"
      - "app/src-tauri/crates/**/Cargo.toml"
      - "app/src-tauri/about.toml"
      - "app/src-tauri/about.hbs"
      - "app/src-tauri/tauri*.conf.json"
      - "app/src-tauri/msstore/**"
      - "app/src-tauri/crates/shell-ext/**"
      - "app/src-tauri/crates/plugins/updates/**"
      - "app/src-tauri/crates/plugins/shell-integration/**"
      - "app/src-tauri/src/lib.rs"
      - "app/src-tauri/src/plugins.rs"
      - "app/src-tauri/src/shell.rs"
      - "app/scripts/third-party-notices.mjs"
      - "scripts/build-msix.ps1"
      - "scripts/get-cargo-about.sh"
      - ".github/workflows/ci-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Microsoft Store flavor: no updater, no registry writer (`--no-default-features --features store`), the shell
  # extension DLL (profile `release-shell`, which unwinds on a panic) and the package (MakeAppx checks the manifest).
  # The package is not kept: the Release workflow builds the one that is uploaded.
  store:
    name: Store package (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (pinned)
        run: rustup toolchain install

      # Saved from develop only: every branch, pull request and tag can restore develop's caches, but nothing else can
      # restore theirs, and the repository's 10 GB cache budget evicts the useful ones first when everything saves.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # `tauri::generate_context!` embeds app/dist at compile time.
      - name: Build the frontend
        run: npm run build

      - name: Lint the Store flavor
        working-directory: app/src-tauri
        run: cargo clippy -p permark --no-default-features --features store --all-targets -- -D warnings

      - name: Build and pack the Store package
        shell: pwsh
        working-directory: .
        run: ./scripts/build-msix.ps1 -Build -OutDir "$env:RUNNER_TEMP\msix"

  # The third-party notices every release ships (app/scripts/third-party-notices.mjs): made here too, on the three systems
  # the release jobs run on, so a dependency with a license nobody accepted (app/src-tauri/about.toml), a package without
  # a license or a system where the tool fails stops the push that caused it, not the release. The file is not kept.
  notices:
    name: Third-party notices (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # `cargo about` reads the dependency tree through cargo, which needs the toolchain app/rust-toolchain.toml pins.
      - name: Install Rust (pinned)
        working-directory: app
        run: rustup toolchain install

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Get cargo-about
        shell: bash
        run: bash scripts/get-cargo-about.sh

      - name: Make the notices
        working-directory: app
        run: npm run notices
