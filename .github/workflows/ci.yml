name: CI

# The quality gate (`npm run check` in app/: version, rustfmt, prettier, build, clippy -D warnings, svelte-check,
# cargo test, vitest)
# on every push to the long-lived branches, to feature, release and hotfix branches (the release flow needs no pull
# request), and on every pull request.

on:
  push:
    branches: [develop, main, "feature/**", "release/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Line tables only in dev + test builds: backtraces keep file:line, while the ~40 test binaries link faster and the
  # cached target folder is about half the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    # The program lives in app/ (npm, cargo, rust-toolchain.toml all resolve from there).
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The system libraries the Tauri crates link against on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libappindicator3-dev             librsvg2-dev             patchelf             libgtk-3-dev             libsoup-3.0-dev             libjavascriptcoregtk-4.1-dev

      # Installs the toolchain app/rust-toolchain.toml pins (with clippy + rustfmt).
      - name: Install Rust (pinned)
        run: rustup toolchain install

      # Saved from develop only: every branch, pull request and tag can restore develop's caches, but nothing else can
      # restore theirs, and the repository's 10 GB cache budget evicts the useful ones first when everything saves.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # The exact token counts are tested against the reference counts, which needs the two public rank files. They are
      # not part of the repository (the app downloads them after the person asks); the hashes are the ones the app pins.
      - name: Fetch the token rank files (tests only)
        shell: bash
        run: |
          dir="$RUNNER_TEMP/token-vocab"
          mkdir -p "$dir"
          fetch() {
            curl -fsSL --retry 3 -o "$dir/$1.tiktoken" "https://openaipublic.blob.core.windows.net/encodings/$1.tiktoken"
            got=$(openssl dgst -sha256 -r "$dir/$1.tiktoken" | cut -d' ' -f1)
            if [ "$got" != "$2" ]; then echo "unexpected hash for $1: $got"; exit 1; fi
          }
          fetch o200k_base 446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d
          fetch cl100k_base 223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7
          echo "PERMARK_TOKEN_VOCAB_DIR=$dir" >> "$GITHUB_ENV"
          echo "PERMARK_TOKEN_VOCAB_REQUIRED=1" >> "$GITHUB_ENV"

      # Builds the frontend first (`tauri::generate_context!` embeds app/dist at compile time).
      - name: Quality gate
        run: npm run check

      # `cargo test` regenerated the IPC types (ts-rs); committed ones must match.
      - name: Generated IPC types are committed
        shell: bash
        run: git diff --exit-code -- src/api/generated

  # The Microsoft Store flavor: no updater, no registry writer (`--no-default-features --features store`), the shell
  # extension DLL (profile `release-shell`, which unwinds on a panic) and the package (MakeAppx checks the manifest).
  # The package is not kept: the Release workflow builds the one that is uploaded.
  store:
    name: Store package (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned)
        run: rustup toolchain install

      # Saved from develop only: every branch, pull request and tag can restore develop's caches, but nothing else can
      # restore theirs, and the repository's 10 GB cache budget evicts the useful ones first when everything saves.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # `tauri::generate_context!` embeds app/dist at compile time.
      - name: Build the frontend
        run: npm run build

      - name: Lint the Store flavor
        working-directory: app/src-tauri
        run: cargo clippy -p permark --no-default-features --features store --all-targets -- -D warnings

      - name: Build and pack the Store package
        shell: pwsh
        working-directory: .
        run: ./scripts/build-msix.ps1 -Build -OutDir "$env:RUNNER_TEMP\msix"
