name: Snap

# Builds the snap from snap/snapcraft.yaml and publishes it to the Snap Store (the Ubuntu App Center).
# The snap packages the release's .deb, downloaded from the public release, so it cannot run beside the platform builds:
# the Release workflow calls it as soon as its `publish` job made the release public (it does not wait for the Store
# package). It can also be run by hand.
# Releases go to `stable` (the snap was tried on a desktop); set the `channel` default below to `edge` to hold them back.

on:
  workflow_call:
    inputs:
      channel:
        description: "Snap Store channel to release to"
        type: string
        default: stable
      ref:
        description: "The tag to build from"
        type: string
        required: true
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: true
  workflow_dispatch:
    inputs:
      channel:
        description: "Snap Store channel to release to"
        required: true
        default: edge
        type: choice
        options: [edge, stable]

permissions:
  contents: read

jobs:
  snap:
    name: Build and publish the snap
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # By hand: the branch or tag the run was started on (no `ref` input then).
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build the snap
        id: build
        uses: snapcore/action-build@v1

      - name: Publish to the Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ inputs.channel }}
