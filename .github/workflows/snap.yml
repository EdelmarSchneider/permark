name: Snap

# Builds the snap from snap/snapcraft.yaml and publishes it to the Snap Store (the Ubuntu App Center).
# The snap packages the release's .deb, downloaded from the public release, so it cannot run beside the platform builds:
# the Release workflow calls it as soon as its `publish` job made the release public (it does not wait for the Store
# package). It can also be run by hand.
# Releases go to `stable` (the snap was tried on a desktop); set the `channel` default below to `edge` to hold them back.

on:
  workflow_call:
    inputs:
      channel:
        description: "Snap Store channel to release to"
        type: string
        default: stable
      ref:
        description: "The tag to build from"
        type: string
        required: true
    # SNAPCRAFT_STORE_CREDENTIALS: a secret of the `release` environment of the job below.
  workflow_dispatch:
    inputs:
      channel:
        description: "Snap Store channel to release to"
        required: true
        default: edge
        type: choice
        options: [edge, stable]
      latest_release:
        description: "Package the latest release's .deb when the branch's version has none (else the build fails)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  snap:
    name: Build and publish the snap
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The Snap Store credentials live in this environment, which only release tags and main | develop may use.
    environment: release
    steps:
      # By hand: the branch or tag the run was started on (no `ref` input then).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # snap/snapcraft.yaml packages the .deb of the version in app/package.json and fails when that release has none;
      # this file (read from the build's copy of the source) lets it take the latest release's .deb instead.
      - name: Allow the latest release's .deb
        if: github.event_name == 'workflow_dispatch' && inputs.latest_release
        run: |
          mkdir -p snap/local
          echo latest > snap/local/deb-release

      - name: Build the snap
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0

      - name: Publish to the Snap Store
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ inputs.channel }}
