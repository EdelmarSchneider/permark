name: Release

# Pushing a `v*` tag (made by `git flow release finish`) builds the installers for Windows, macOS (universal) and Linux,
# signs the updater artifacts and publishes the GitHub release together with `latest.json`, the manifest the in-app
# updater reads.
#
# Flow: `draft` makes the release (a draft, invisible to the updater) -> the three `build` jobs build the installers in
# parallel and keep them as artifacts of the run -> `sign` signs the updater bundles, checks every signature with the
# updater key the app trusts, attests the installers' build provenance and uploads installers + `.sig` files to the
# draft -> `publish` checks every installer against its `.sig` again, writes `latest.json` once, from all the `.sig`
# files of the release (app/scripts/updater-json.mjs; same shape as tauri-action's), attaches the SBOMs (made by `sbom`)
# and publishes the release. Installed copies only ever see a complete release; a failed platform leaves a draft
# (re-run the failed jobs: `sign` and `publish` run again after them).
#
# The updater signing key never meets the build. The `build` jobs run third-party code (npm and cargo install and build
# scripts, macros, bundler plugins), so they get no secret and a read-only token. Only `sign` uses the `release`
# environment that holds the key, and it runs nothing from the build: it checks out only the lockfile, the app config
# and the signature check, installs no package and builds nothing. Its signer is the Tauri CLI the lockfile pins,
# downloaded from the npm registry and checked against the lockfile's integrity hash before it runs.
#
# No Rust cache here: a tag run can restore only caches of its own tag or of develop, and develop has no release-profile
# build, so it never hit (and its saves crowded develop's caches out of the 10 GB budget).
#
# The same tag also builds the Microsoft Store package (the `msix` job, see docs/msstore.md). It is a workflow artifact,
# never a release asset: the package is unsigned (the Store signs it), so nobody can install it by hand. When the Store
# secrets are set, the job also uploads it to a draft submission in Partner Center.

on:
  push:
    tags: ["v*"]
  # Rebuild some platforms of an existing release (e.g. one that failed), without moving its tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v0.2.0)"
        required: true
      platforms:
        description: "Comma-separated runners to build: windows-latest, macos-latest, ubuntu-22.04 (or all; none builds no installers)"
        required: true
        default: all
      msix:
        description: "Also build the Microsoft Store package (unsigned, kept as an artifact of this run, not a release asset)"
        type: boolean
        default: false
      msix_ref:
        description: "Store package only: the branch, tag or commit to build it from (default: the tag above). It needs scripts/build-msix.ps1."
        required: false
        default: ""

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # The release of the tag: found (a rebuild, or a re-run after a failure) or made as a draft with the notes.
  draft:
    name: Draft the release
    if: github.event_name == 'push' || inputs.platforms != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      # Fails when the tag does not exist, so no release can make a new tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # The release notes are this version's section of CHANGELOG.md, followed by the install notes below.
      # Feature id tags (`<!-- f: ... -->`, for Hub-D's catalog) are dropped: the in-app update chip shows the notes as plain text.
      # The end marker is random: a fixed one written in CHANGELOG.md would end the notes there and set the lines after
      # it as variables of the next steps.
      - name: Release notes from the changelog
        shell: bash
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { gsub(/ *<!-- f: [^>]*-->/, ""); print }
          ' CHANGELOG.md > release-notes.md
          end="NOTES_$(openssl rand -hex 16)"
          {
            echo "RELEASE_NOTES<<$end"
            cat release-notes.md
            echo "$end"
          } >> "$GITHUB_ENV"

      # `$(printf ...)` drops the trailing newline, as tauri-action did with its `releaseBody` input up to 0.6.1.
      - name: Find or draft the release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: |
            **PerMark** is a free, open-source unified document workspace: one place to read, write and organize Markdown and
            the files around it, and to steer AI projects through their documents. AI speeds the work. Your vision steers it.
            It works with any AI tool, or none: it only relies on your files and git.

            ${{ env.RELEASE_NOTES }}

            ### Install
            | Platform | Download |
            | --- | --- |
            | Windows | the `-setup.exe` installer. The `.msi` ended with version 0.17. If you installed PerMark from an `.msi`, the next in-app update moves it to the `-setup.exe`: Windows asks to remove the old copy and asks for administrator permission; if you say no, it asks again at the next update (other Windows accounts on the same PC then install the `-setup.exe` themselves). You can also uninstall it and install the `-setup.exe`. Your settings and notes stay. If you connected an AI agent, copy its connection lines again from **Settings → Integration → Agent connection**: the program now runs from your user folder |
            | macOS | the universal `.dmg` (Apple silicon and Intel) |
            | Linux | the `.AppImage`, `.deb` or `.rpm` |

            PerMark updates itself: when a new version is out, it offers a one-click "Restart to update".

            ### The app is not code-signed yet
            The installers are unsigned, so your system warns you the first time. They are built by GitHub Actions
            from the tagged commit, and the in-app updates are verified with a signature.

            **Windows (SmartScreen).** If you see "Windows protected your PC", click **More info**, then **Run anyway**.

            **macOS (Gatekeeper).** If macOS says it can't verify PerMark, open **System Settings, Privacy & Security**,
            scroll to the Security section and click **Open Anyway**. On older macOS versions you can right-click the
            app and choose **Open** instead. From a terminal: `xattr -dr com.apple.quarantine /Applications/PerMark.app`.

            **Linux.** Make the AppImage executable (`chmod +x PerMark_*.AppImage`) and run it, or install the `.deb` / `.rpm`.
        run: |
          # Drafts too (the by-tag endpoint skips them).
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id')
          if ! [[ "$id" =~ ^[0-9]*$ ]]; then
            echo "More than one release has the tag $TAG: $id"
            exit 1
          fi
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="PerMark $TAG" -f body="$(printf '%s' "$BODY")" \
              -F draft=true -F prerelease=false --jq .id)
            echo "Drafted release $id for $TAG."
          else
            echo "Found release $id for $TAG."
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # The installers of one platform, kept as the artifact `bundles-<runner>` under their release asset names.
  build:
    name: Build (${{ matrix.platform }})
    needs: draft
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    # No environment and no secret: this is where third-party code runs.
    permissions:
      contents: read
    env:
      RUN_THIS: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, matrix.platform) }}
    strategy:
      fail-fast: false
      # In parallel: each job keeps only its own installers; `sign` uploads them, `publish` writes latest.json once.
      matrix:
        include:
          - platform: windows-latest
            rust-targets: ""
            args: ""
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            rust-targets: ""
            args: ""
    steps:
      - name: Checkout
        if: env.RUN_THIS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # The system libraries the Tauri crates link against and the AppImage bundler needs.
      - name: Install Linux dependencies
        if: env.RUN_THIS == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # The toolchain app/rust-toolchain.toml pins; rustup reads the file from the working directory.
      - name: Install Rust (pinned)
        if: env.RUN_THIS == 'true'
        working-directory: app
        run: rustup toolchain install

      - name: Add the cross-compilation targets to the pinned toolchain
        if: env.RUN_THIS == 'true' && matrix.rust-targets != ''
        working-directory: app
        shell: bash
        run: rustup target add $(echo "${{ matrix.rust-targets }}" | tr ',' ' ')

      - name: Set up Node
        if: env.RUN_THIS == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        if: env.RUN_THIS == 'true'
        working-directory: app
        run: npm ci

      # The licenses of the third-party software inside, shipped in every installer (bundle.resources) and opened from
      # the app's About. Fails the release when a crate's license is not accepted (app/src-tauri/about.toml).
      - name: Get cargo-about
        if: env.RUN_THIS == 'true'
        shell: bash
        run: bash scripts/get-cargo-about.sh

      - name: Third-party notices
        if: env.RUN_THIS == 'true'
        working-directory: app
        run: npm run notices

      # The interface, then the program and its installers. The overlay src-tauri/tauri.signing.conf.json empties
      # `beforeBuildCommand`, so the interface is not built twice.
      # Tauri signs the updater bundles it makes and stops when the app has an updater key but no private key. A
      # throwaway key made here lets it finish (Tauri warns that it does not match the app's key); its `.sig` files are
      # never kept: `sign` signs the installers with the real key.
      - name: Build the program and its installers
        if: env.RUN_THIS == 'true'
        working-directory: app
        shell: bash
        env:
          ARGS: ${{ matrix.args }}
        run: |
          npm run build
          key="$RUNNER_TEMP/throwaway.key"
          npx tauri signer generate --ci -w "$key"
          # shellcheck disable=SC2086 # ARGS holds several words or none
          TAURI_SIGNING_PRIVATE_KEY="$key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" \
            npx tauri build $ARGS --config src-tauri/tauri.signing.conf.json

      # The installers under the names tauri-action gave the release assets up to 0.17: the CLI's file names, but the
      # macOS updater bundle gets the version and architecture like the other installers
      # (`PerMark_<version>_universal.app.tar.gz`; universal is the only macOS build). The `.app` folder ships inside
      # the `.dmg`; the throwaway `.sig` files stay behind.
      - name: Collect the installers
        if: env.RUN_THIS == 'true'
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bundles"
          mkdir -p "$out"
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          for file in src-tauri/target/release/bundle/*/* src-tauri/target/*/release/bundle/*/*; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            case "$name" in
              *-setup.exe | *.dmg | *.AppImage | *.deb | *.rpm) cp "$file" "$out/$name" ;;
              *.app.tar.gz) cp "$file" "$out/${name%.app.tar.gz}_${version}_universal.app.tar.gz" ;;
            esac
          done
          ls -l "$out"

      - name: Keep the installers for the signing job
        if: env.RUN_THIS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.platform }}
          path: ${{ runner.temp }}/bundles/
          if-no-files-found: error
          # installers are compressed already
          compression-level: 0
          # a re-run of this job replaces what an earlier attempt kept
          overwrite: true

  # Signs the updater bundles of the installers built in this run, checks the signatures, attests the installers and
  # uploads installers + `.sig` files to the draft. It runs when some platform failed too (the others' assets go up;
  # `publish` still waits for all) and signs only what this run built (a rebuild of some platforms signs those).
  # The key reaches one step only, and no step runs code from npm, cargo or the build.
  sign:
    name: Sign and upload the installers
    needs: [draft, build]
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The updater signing key lives in this environment, which only release tags and main | develop may use.
    environment: release
    permissions:
      contents: write # uploads the installers and their signatures to the draft
      # The build provenance attestations of the installers (`gh attestation verify`).
      id-token: write
      attestations: write
    steps:
      # Only what this job reads: the lockfile (the signer's version and integrity hash), the app config (version and
      # updater key) and the script that picks and checks the updater bundles (Node built-ins only).
      - name: Checkout the lockfile, the app config and the signature check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          sparse-checkout: |
            app/package-lock.json
            app/src-tauri/tauri.conf.json
            app/scripts/updater-json.mjs
          sparse-checkout-cone-mode: false

      - name: Download the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: ${{ runner.temp }}/bundles
          merge-multiple: true

      # The signer is the Linux build of the Tauri CLI the lockfile pins (a Node addon; no install script runs), checked
      # against the lockfile's integrity hash before it is unpacked. Bumping @tauri-apps/cli in the lockfile bumps it.
      - name: Get the pinned signer
        id: signer
        shell: bash
        run: |
          set -euo pipefail
          echo "Source files in this job:"
          find . -path ./.git -prune -o -type f -print
          entry=$(jq -c '.packages["node_modules/@tauri-apps/cli-linux-x64-gnu"]' app/package-lock.json)
          version=$(jq -r .version <<<"$entry")
          url=$(jq -r .resolved <<<"$entry")
          integrity=$(jq -r .integrity <<<"$entry")
          if [ "$url" != "https://registry.npmjs.org/@tauri-apps/cli-linux-x64-gnu/-/cli-linux-x64-gnu-$version.tgz" ]; then
            echo "::error::The lockfile does not pin the signer to the npm registry: $url"
            exit 1
          fi
          dir="$RUNNER_TEMP/signer"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/cli.tgz" "$url"
          actual="sha512-$(openssl dgst -sha512 -binary "$dir/cli.tgz" | base64 -w0)"
          if [ "$actual" != "$integrity" ]; then
            echo "::error::The signer download is not the one the lockfile pins: $actual, want $integrity"
            exit 1
          fi
          tar -xzf "$dir/cli.tgz" -C "$dir"
          echo "addon=$dir/package/cli.linux-x64-gnu.node" >> "$GITHUB_OUTPUT"
          echo "Signer: @tauri-apps/cli-linux-x64-gnu $version, integrity checked against the lockfile."

      # A `.sig` that came with the installers is never trusted: every updater bundle is signed below.
      - name: Pick the updater bundles
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP"/bundles/*.sig
          ls -l "$RUNNER_TEMP/bundles"
          node app/scripts/updater-json.mjs bundles "$RUNNER_TEMP/bundles" > "$RUNNER_TEMP/to-sign.txt"
          if [ ! -s "$RUNNER_TEMP/to-sign.txt" ]; then
            echo "::error::This run built no updater bundle."
            exit 1
          fi

      # The key reaches this step only (it has no password). Each signature names the app version, as `tauri build`
      # signs them.
      - name: Sign the updater bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ADDON: ${{ steps.signer.outputs.addon }}
        run: |
          set -euo pipefail
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          while IFS= read -r name; do
            node -e '
              const [addon, ...args] = process.argv.slice(1);
              require(addon).run(args, "tauri", (error) => {
                if (error) {
                  console.error(error.message);
                  process.exit(1);
                }
              });
            ' "$ADDON" signer sign --password "" --app-version "$version" "$RUNNER_TEMP/bundles/$name" > /dev/null
            echo "Signed $name"
          done < "$RUNNER_TEMP/to-sign.txt"

      # The in-app updater's check, with the key the app trusts (plugins.updater.pubkey): nothing goes up when one
      # signature does not verify.
      - name: Check the signatures
        run: node app/scripts/updater-json.mjs verify "$RUNNER_TEMP/bundles"

      # Not blocking: a failed attestation leaves the installers as they were before attestations existed.
      - name: Attest the installers' build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/bundles/*.exe
            ${{ runner.temp }}/bundles/*.dmg
            ${{ runner.temp }}/bundles/*.app.tar.gz
            ${{ runner.temp }}/bundles/*.AppImage
            ${{ runner.temp }}/bundles/*.deb
            ${{ runner.temp }}/bundles/*.rpm

      # A re-run or a rebuild replaces the assets of the same name.
      - name: Upload the installers and their signatures
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$ID/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
          upload() { # <file> <asset name>
            old=$(jq -r --arg name "$2" '.[] | select(.name == $name) | .id' "$RUNNER_TEMP/assets.json")
            if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$1" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$2" |
              jq -r .browser_download_url
          }
          for file in "$RUNNER_TEMP"/bundles/*; do upload "$file" "$(basename "$file")"; done

  # The software bills of materials (CycloneDX) of what ships: the Rust crates compiled in (all three systems) and
  # the npm packages the interface bundles. Both tools read the lockfiles only: no build, no install script.
  # cargo-cyclonedx = pinned prebuilt binary, checked against its published sha256 (bumping: new version + the
  # sha256 published beside that release's x86_64-unknown-linux-musl asset). Read-only: `publish` attaches them. Not
  # blocking: without them the release still goes out, with a warning.
  sbom:
    name: Make the SBOMs
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      made: ${{ steps.sbom.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Make the SBOMs
        id: sbom
        continue-on-error: true
        shell: bash
        env:
          VERSION: "0.5.10"
          SHA256: "528be9dd99ae522c3ee14fb881fd0cbf51767e8f12b74248f437e6a66b1a3c1b"
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/cargo-cyclonedx"
          mkdir -p "$tool" "$RUNNER_TEMP/sbom"
          curl -fsSL --retry 3 -o "$tool/cyclonedx.tar.xz" \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${VERSION}/cargo-cyclonedx-x86_64-unknown-linux-musl.tar.xz"
          echo "${SHA256}  $tool/cyclonedx.tar.xz" | sha256sum -c -
          tar -xJf "$tool/cyclonedx.tar.xz" --strip-components 1 -C "$tool"
          # Writes <crate>.cdx.json beside the Cargo.toml of every workspace member; `permark` is the program.
          PATH="$tool:$PATH" cargo cyclonedx --manifest-path app/src-tauri/Cargo.toml --format json --spec-version 1.5 --target all
          name="PerMark_${TAG#v}"
          mv app/src-tauri/permark.cdx.json "$RUNNER_TEMP/sbom/${name}_rust.cdx.json"
          # npm 10 (the runner's) names the root component after the folder it runs in ("app"), not the package, and
          # has no flag for it: it reads a copy of the manifest and lockfile in a folder named after the package.
          npm_root="$RUNNER_TEMP/permark"
          mkdir -p "$npm_root"
          cp app/package.json app/package-lock.json "$npm_root/"
          (cd "$npm_root" && npm sbom --omit dev --sbom-format cyclonedx --sbom-type application --package-lock-only) \
            > "$RUNNER_TEMP/sbom/${name}_npm.cdx.json"

      - name: Keep the SBOMs for the publish job
        if: steps.sbom.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          overwrite: true

  # `latest.json` from every `.sig` of the release (all platforms, also after a rebuild of some), then the release goes
  # public. The script refuses a release with a platform missing or an installer its `.sig` does not verify, so the
  # draft stays a draft. It waits for every platform to be built and signed; the SBOMs never hold it back.
  publish:
    name: Publish the release
    needs: [draft, build, sign, sbom]
    if: ${{ !cancelled() && needs.draft.result == 'success' && needs.build.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # uploads latest.json and the SBOMs, then publishes the release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ID: ${{ needs.draft.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # Every asset but the ones this job writes: the `.sig` files and the installers they sign, checked below.
      - name: Download the installers and their signatures
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" > "$RUNNER_TEMP/release.json"
          mkdir -p "$RUNNER_TEMP/assets"
          jq -r '.assets[] | select(.name != "latest.json" and (.name | endswith(".cdx.json") | not)) | "\(.id) \(.name)"' \
            "$RUNNER_TEMP/release.json" |
            while read -r asset name; do
              case "$name" in */* | *\\*) echo "unexpected asset name: $name"; exit 1 ;; esac
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" \
                > "$RUNNER_TEMP/assets/$name"
            done

      - name: Write latest.json
        run: node app/scripts/updater-json.mjs "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/assets" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/latest.json"

      # The SBOMs the `sbom` job made, when it made them. Not blocking either.
      - name: Download the SBOMs
        id: sboms
        if: needs.sbom.outputs.made == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom

      # A re-run replaces what an earlier run uploaded.
      - name: Upload latest.json and the SBOMs
        shell: bash
        env:
          SBOM: ${{ steps.sboms.outcome }}
        run: |
          upload() { # <file> <asset name>
            old=$(jq -r --arg name "$2" '.assets[] | select(.name == $name) | .id' "$RUNNER_TEMP/release.json")
            if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              --data-binary "@$1" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$2" |
              jq -r .browser_download_url
          }
          upload "$RUNNER_TEMP/latest.json" latest.json
          if [ "$SBOM" = "success" ]; then
            for file in "$RUNNER_TEMP"/sbom/*.cdx.json; do upload "$file" "$(basename "$file")"; done
          else
            echo "::warning::The release goes out without its SBOM files: making or downloading them failed (see the sbom job and the step above)."
          fi

      # A rebuild of an already public release leaves it as it is (it may not be the latest one).
      - name: Publish the release
        shell: bash
        run: |
          if [ "$(jq -r .draft "$RUNNER_TEMP/release.json")" = "true" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true --jq .html_url
          else
            echo "Already public."
          fi

  # The snap repacks the public .deb (snap.yml), so it starts right after `publish`; not when no Linux build ran.
  snap:
    name: Snap
    needs: publish
    if: github.event_name == 'push' || inputs.platforms == 'all' || contains(inputs.platforms, 'ubuntu-22.04')
    permissions:
      contents: read
    uses: ./.github/workflows/snap.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    # No secrets passed: the Store credentials are a secret of the `release` environment, which the called job uses.

  # The Microsoft Store package: the Store flavor of the program, packed as an unsigned .msix by scripts/build-msix.ps1.
  # It goes up as an artifact of this run, which is where the person who submits to the Store downloads it (the Store
  # signs what is uploaded; an unsigned package cannot be installed by users, so it is not a release asset).
  # A run started by hand (workflow_dispatch with `msix` on) builds one for any branch, tag or commit that has the script.
  # On a tag push with the Store secrets of the `release` environment set, it is also uploaded to a draft submission.
  msix:
    name: Microsoft Store package
    if: github.event_name == 'push' || inputs.msix
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.msix_ref || inputs.tag) || github.ref_name }}
      # "true" only when all four Store secrets exist. A step's `if` cannot read secrets, and this keeps their values
      # out of the environment of the build steps (npm and cargo run third-party code): only the upload step gets them.
      MSSTORE: ${{ secrets.MSSTORE_TENANT_ID != '' && secrets.MSSTORE_SELLER_ID != '' && secrets.MSSTORE_CLIENT_ID != '' && secrets.MSSTORE_CLIENT_SECRET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Install Rust (pinned)
        working-directory: app
        run: rustup toolchain install

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # The package carries the third-party licenses beside the program (scripts/build-msix.ps1 copies them).
      - name: Get cargo-about
        shell: bash
        run: bash scripts/get-cargo-about.sh

      - name: Third-party notices
        working-directory: app
        run: npm run notices

      # A release is tagged after its version is bumped, so the tag and the app's version are the same number.
      - name: Check that the tag is the app's version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME is not the app's version, $version."
          }

      - name: Build the Store flavor and pack it
        id: pack
        shell: pwsh
        run: ./scripts/build-msix.ps1 -Build -OutDir "$env:RUNNER_TEMP\msix"

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PerMark-msix-${{ steps.pack.outputs.version }}
          path: ${{ steps.pack.outputs.msix }}
          if-no-files-found: error

      # The upload to Partner Center. Only a tag push uploads: a run started by hand can build any branch, and its package
      # must not replace the release's. Without the Store secrets both steps are skipped and the job ends as before.
      # `msstore publish` makes a new draft from the last published submission with this package in it; `--noCommit`
      # leaves it a draft, because its listing (release notes included) is still the previous version's and someone
      # finishes it in Partner Center. A failed upload fails this job only; the artifact above is there for a manual upload.
      - name: Set up the Microsoft Store CLI
        if: github.event_name == 'push' && env.MSSTORE == 'true'
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.4

      - name: Upload the package to a draft submission
        id: store
        if: github.event_name == 'push' && env.MSSTORE == 'true'
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          # The Store ID of PerMark (apps.microsoft.com/detail/9NVV5GVZMGGX).
          PRODUCT_ID: 9NVV5GVZMGGX
          PACKAGE: ${{ steps.pack.outputs.msix }}
        run: |
          # Every other command needs the credentials, so `reconfigure` runs first; telemetry goes off right after it.
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "Signing in to Partner Center failed." }
          msstore settings --enableTelemetry false
          if ($LASTEXITCODE -ne 0) { throw "Turning the CLI's telemetry off failed." }
          msstore publish $env:PACKAGE --appId $env:PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw "Uploading the package to Partner Center failed." }

      - name: Say what was built
        shell: pwsh
        env:
          UPLOADED: ${{ steps.store.outcome == 'success' }}
          PACKAGE: ${{ steps.pack.outputs.msix }}
        run: |
          $package = Get-Item -LiteralPath $env:PACKAGE
          $commit = git rev-parse HEAD
          $next = if ($env:UPLOADED -eq 'true') {
            "It is in a draft submission in Partner Center: add the release notes there and submit it."
          } else {
            "Download it from this run's artifacts and upload it in Partner Center."
          }
          @(
            "### Microsoft Store package",
            "",
            "Built from ``$env:REF`` at commit ``$commit``.",
            "",
            "``$($package.Name)``, $([math]::Round($package.Length / 1MB, 1)) MiB, not signed. $next"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
