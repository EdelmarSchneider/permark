name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time; let an in-progress deploy finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Screenshots and the loop video live in docs/assets (used by the README). Copy them into the site
      # unless a site-specific copy is already committed under site/assets.
      - name: Sync screenshots into site/assets
        run: |
          mkdir -p site/assets
          for f in docs/assets/screenshot-*.png docs/assets/loop.* docs/assets/loop-poster.png; do
            [ -e "$f" ] || continue
            cp -n "$f" site/assets/
          done
          ls -la site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
