# Workflows pin actions to commit SHAs; this keeps those pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      actions:
        patterns:
          - "*"
        # The release build action changes how release assets are made: it gets a pull request of its own.
        exclude-patterns:
          - "tauri-apps/tauri-action"
    commit-message:
      prefix: ci
