[workspace]
members = ["crates/core"]
resolver = "2"

# Version source = app/package.json; written here by `npm run version:sync`.
[workspace.package]
version = "0.5.8"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EdelmarSchneider/permark"
authors = ["Edelmar Schneider"]

[workspace.dependencies]
permark-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12.0", features = ["serde-json-impl"] }
serde_json = "1"
thiserror = "2.0.21"
dunce = "1.0.5"
unicode-normalization = "0.1.25"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
toml_edit = "0.25.17"
dirs = "7.0.0"
interprocess = "2.4.4"
widestring = "1.2.1"
rustix = { version = "1.1.5", features = ["process"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# App crate: Tauri shell (windows, IPC commands, events, OS integration). Thin: commands adapt core services.
[package]
name = "permark"
description = "A local-first working environment for documents: Markdown and the files around it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# `_lib` suffix: lib + bin of one package must not share a name (cargo#8519, Windows).
name = "permark_lib"

[features]
# Plugin crates join here as features; default = full build.
default = []
# Microsoft Store build (Store updates the app; distribution slice).
store = []

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
permark-core.workspace = true
# generate_context! expands to serde_json (plugin config).
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8.2"

[lints]
workspace = true
