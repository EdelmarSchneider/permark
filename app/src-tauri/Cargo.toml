[workspace]
members = ["crates/core", "crates/plugins/*", "crates/shell-ext"]
resolver = "2"

# Version source = app/package.json; written here by `npm run version:sync`.
[workspace.package]
version = "0.6.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EdelmarSchneider/permark"
authors = ["Edelmar Schneider"]

[workspace.dependencies]
permark-core = { path = "crates/core" }
permark-plugin-frontmatter-card = { path = "crates/plugins/frontmatter-card" }
permark-plugin-follow = { path = "crates/plugins/follow" }
permark-plugin-git = { path = "crates/plugins/git" }
permark-plugin-highlight = { path = "crates/plugins/highlight" }
permark-plugin-json-view = { path = "crates/plugins/json-view" }
permark-plugin-live-feed = { path = "crates/plugins/live-feed" }
permark-plugin-math = { path = "crates/plugins/math" }
permark-plugin-md-family = { path = "crates/plugins/md-family" }
permark-plugin-media = { path = "crates/plugins/media" }
permark-plugin-mermaid = { path = "crates/plugins/mermaid" }
permark-plugin-plantuml = { path = "crates/plugins/plantuml" }
permark-plugin-review = { path = "crates/plugins/review" }
permark-plugin-prompt-blocks = { path = "crates/plugins/prompt-blocks" }
permark-plugin-text-view = { path = "crates/plugins/text-view" }
permark-plugin-broken-links = { path = "crates/plugins/broken-links" }
permark-plugin-notes = { path = "crates/plugins/notes" }
permark-plugin-quiet = { path = "crates/plugins/quiet" }
permark-plugin-comments = { path = "crates/plugins/comments" }
permark-plugin-agent = { path = "crates/plugins/agent" }
permark-plugin-tags = { path = "crates/plugins/tags" }
permark-plugin-unread = { path = "crates/plugins/unread" }
permark-plugin-word-count = { path = "crates/plugins/word-count" }
permark-plugin-token-count = { path = "crates/plugins/token-count" }
permark-plugin-xml-view = { path = "crates/plugins/xml-view" }
permark-plugin-fmt-toml = { path = "crates/plugins/fmt-toml" }
permark-plugin-fmt-yaml = { path = "crates/plugins/fmt-yaml" }
permark-plugin-fmt-ini = { path = "crates/plugins/fmt-ini" }
permark-plugin-fmt-dotenv = { path = "crates/plugins/fmt-dotenv" }
permark-plugin-fmt-properties = { path = "crates/plugins/fmt-properties" }
permark-plugin-fmt-ignore = { path = "crates/plugins/fmt-ignore" }
permark-plugin-fmt-toon = { path = "crates/plugins/fmt-toon" }
permark-plugin-convert = { path = "crates/plugins/convert" }
permark-plugin-shell-integration = { path = "crates/plugins/shell-integration" }
permark-plugin-updates = { path = "crates/plugins/updates" }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12.0", features = ["serde-json-impl"] }
# Objects keep their key order (TOON, conversions); floats read back exactly.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
toon-format = { version = "0.7.0", default-features = false }
thiserror = "2.0.21"
dunce = "1.0.5"
unicode-normalization = "0.1.25"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
toml_edit = "0.25.17"
dirs = "7.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
interprocess = "2.4.4"
widestring = "1.2.1"
winreg = "0.56.0"
rustix = { version = "1.1.5", features = ["process"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Pipes",
] }
tempfile = "3.27.0"
ignore = "0.4.33"
notify = "8.2.0"
trash = "5.2.9"
comrak = { version = "0.56", default-features = false }
ammonia = "4.2"
git2 = { version = "0.21.0", default-features = false }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "io-util"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The Store package's shell extension DLL (`-p permark-shell --profile release-shell`): it unwinds so no panic crosses
# the COM boundary (a panic setting cannot be given per package), and it is small (a system process loads it).
[profile.release-shell]
inherits = "release"
panic = "unwind"
opt-level = "s"

# App crate: Tauri shell (windows, IPC commands, events, OS integration). Thin: commands adapt core services.
[package]
name = "permark"
description = "A local-first unified document workspace: Markdown and the files around it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# `_lib` suffix: lib + bin of one package must not share a name (cargo#8519, Windows).
name = "permark_lib"

[features]
# Plugin crates join here as features; default = full build.
# default = the direct build; `store` = the Microsoft Store build (`--no-default-features --features store`): the
# store updates the app and the package declares the file manager entries.
default = ["common", "plugin-updates", "plugin-shell-integration"]
common = ["plugin-git", "plugin-live-feed", "plugin-follow", "plugin-unread", "plugin-review", "plugin-md-family", "plugin-prompt-blocks", "plugin-frontmatter-card", "plugin-highlight", "plugin-math", "plugin-mermaid", "plugin-plantuml", "plugin-media", "plugin-json-view", "plugin-xml-view", "plugin-text-view", "plugin-word-count", "plugin-token-count", "plugin-tags", "plugin-quiet", "plugin-comments", "plugin-broken-links", "plugin-notes", "plugin-agent", "plugin-fmt-toml", "plugin-fmt-yaml", "plugin-fmt-ini", "plugin-fmt-dotenv", "plugin-fmt-properties", "plugin-fmt-ignore", "plugin-fmt-toon", "plugin-convert"]
plugin-git = ["dep:permark-plugin-git"]
plugin-live-feed = ["dep:permark-plugin-live-feed"]
# follow needs the feed; review needs unread (a build without the dependency has no plugin that needs it)
plugin-follow = ["dep:permark-plugin-follow", "plugin-live-feed"]
plugin-unread = ["dep:permark-plugin-unread"]
plugin-review = ["dep:permark-plugin-review", "plugin-unread"]
plugin-md-family = ["dep:permark-plugin-md-family"]
plugin-word-count = ["dep:permark-plugin-word-count"]
plugin-token-count = ["dep:permark-plugin-token-count"]
plugin-prompt-blocks = ["dep:permark-plugin-prompt-blocks"]
plugin-frontmatter-card = ["dep:permark-plugin-frontmatter-card"]
plugin-highlight = ["dep:permark-plugin-highlight"]
plugin-math = ["dep:permark-plugin-math"]
plugin-mermaid = ["dep:permark-plugin-mermaid"]
plugin-plantuml = ["dep:permark-plugin-plantuml"]
plugin-media = ["dep:permark-plugin-media"]
plugin-json-view = ["dep:permark-plugin-json-view"]
plugin-xml-view = ["dep:permark-plugin-xml-view"]
plugin-fmt-toml = ["dep:permark-plugin-fmt-toml"]
plugin-fmt-yaml = ["dep:permark-plugin-fmt-yaml"]
plugin-fmt-ini = ["dep:permark-plugin-fmt-ini"]
plugin-fmt-dotenv = ["dep:permark-plugin-fmt-dotenv"]
plugin-fmt-properties = ["dep:permark-plugin-fmt-properties"]
plugin-fmt-ignore = ["dep:permark-plugin-fmt-ignore"]
plugin-fmt-toon = ["dep:permark-plugin-fmt-toon"]
plugin-convert = ["plugin-fmt-toon", "dep:permark-plugin-convert"]
plugin-text-view = ["dep:permark-plugin-text-view"]
plugin-tags = ["dep:permark-plugin-tags"]
plugin-quiet = ["dep:permark-plugin-quiet"]
plugin-comments = ["dep:permark-plugin-comments"]
plugin-broken-links = ["dep:permark-plugin-broken-links"]
plugin-notes = ["dep:permark-plugin-notes"]
plugin-agent = ["dep:permark-plugin-agent"]
plugin-updates = ["dep:permark-plugin-updates", "dep:tauri-plugin-updater"]
plugin-shell-integration = ["dep:permark-plugin-shell-integration"]
store = ["common"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
permark-core.workspace = true
permark-plugin-git = { workspace = true, optional = true }
permark-plugin-live-feed = { workspace = true, optional = true }
permark-plugin-follow = { workspace = true, optional = true }
permark-plugin-unread = { workspace = true, optional = true }
permark-plugin-review = { workspace = true, optional = true }
permark-plugin-md-family = { workspace = true, optional = true }
permark-plugin-word-count = { workspace = true, optional = true }
permark-plugin-token-count = { workspace = true, optional = true }
permark-plugin-prompt-blocks = { workspace = true, optional = true }
permark-plugin-frontmatter-card = { workspace = true, optional = true }
permark-plugin-highlight = { workspace = true, optional = true }
permark-plugin-math = { workspace = true, optional = true }
permark-plugin-mermaid = { workspace = true, optional = true }
permark-plugin-plantuml = { workspace = true, optional = true }
permark-plugin-media = { workspace = true, optional = true }
permark-plugin-json-view = { workspace = true, optional = true }
permark-plugin-xml-view = { workspace = true, optional = true }
permark-plugin-fmt-toml = { workspace = true, optional = true }
permark-plugin-fmt-yaml = { workspace = true, optional = true }
permark-plugin-fmt-ini = { workspace = true, optional = true }
permark-plugin-fmt-dotenv = { workspace = true, optional = true }
permark-plugin-fmt-properties = { workspace = true, optional = true }
permark-plugin-fmt-ignore = { workspace = true, optional = true }
permark-plugin-fmt-toon = { workspace = true, optional = true }
permark-plugin-convert = { workspace = true, optional = true }
permark-plugin-text-view = { workspace = true, optional = true }
permark-plugin-tags = { workspace = true, optional = true }
permark-plugin-quiet = { workspace = true, optional = true }
permark-plugin-comments = { workspace = true, optional = true }
permark-plugin-broken-links = { workspace = true, optional = true }
permark-plugin-notes = { workspace = true, optional = true }
permark-plugin-agent = { workspace = true, optional = true }
permark-plugin-updates = { workspace = true, optional = true }
permark-plugin-shell-integration = { workspace = true, optional = true }
# generate_context! expands to serde_json (plugin config).
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
# `unstable`: child webviews (one per tab inside a native window: `Window::add_child`, `Webview::reparent`)
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = { version = "2.13", optional = true }
# web pictures the person asks for (same client as the token count download)
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
