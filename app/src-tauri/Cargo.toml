[workspace]
members = ["crates/core"]
resolver = "2"

# Version source = app/package.json; written here by `npm run version:sync`.
[workspace.package]
version = "0.5.8"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EdelmarSchneider/permark"
authors = ["Edelmar Schneider"]

[workspace.dependencies]
permark-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
ts-rs = "12.0"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# App crate: Tauri shell (windows, IPC commands, events, OS integration). Thin: commands adapt core services.
[package]
name = "permark"
description = "A local-first working environment for documents: Markdown and the files around it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# `_lib` suffix: lib + bin of one package must not share a name (cargo#8519, Windows).
name = "permark_lib"

[features]
# Plugin crates join here as features; default = full build.
default = []

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
permark-core.workspace = true
# generate_context! expands to serde_json (plugin config).
serde_json.workspace = true
tauri = { version = "2.12", features = [] }

[lints]
workspace = true
