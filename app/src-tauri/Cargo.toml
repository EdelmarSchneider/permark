[workspace]
members = ["crates/core", "crates/plugins/*"]
resolver = "2"

# Version source = app/package.json; written here by `npm run version:sync`.
[workspace.package]
version = "0.5.8"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EdelmarSchneider/permark"
authors = ["Edelmar Schneider"]

[workspace.dependencies]
permark-core = { path = "crates/core" }
permark-plugin-frontmatter-card = { path = "crates/plugins/frontmatter-card" }
permark-plugin-follow = { path = "crates/plugins/follow" }
permark-plugin-git = { path = "crates/plugins/git" }
permark-plugin-highlight = { path = "crates/plugins/highlight" }
permark-plugin-json-view = { path = "crates/plugins/json-view" }
permark-plugin-live-feed = { path = "crates/plugins/live-feed" }
permark-plugin-math = { path = "crates/plugins/math" }
permark-plugin-md-family = { path = "crates/plugins/md-family" }
permark-plugin-media = { path = "crates/plugins/media" }
permark-plugin-mermaid = { path = "crates/plugins/mermaid" }
permark-plugin-plantuml = { path = "crates/plugins/plantuml" }
permark-plugin-review = { path = "crates/plugins/review" }
permark-plugin-prompt-blocks = { path = "crates/plugins/prompt-blocks" }
permark-plugin-text-view = { path = "crates/plugins/text-view" }
permark-plugin-unread = { path = "crates/plugins/unread" }
permark-plugin-word-count = { path = "crates/plugins/word-count" }
permark-plugin-xml-view = { path = "crates/plugins/xml-view" }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12.0", features = ["serde-json-impl"] }
serde_json = "1"
thiserror = "2.0.21"
dunce = "1.0.5"
unicode-normalization = "0.1.25"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
toml_edit = "0.25.17"
dirs = "7.0.0"
interprocess = "2.4.4"
widestring = "1.2.1"
rustix = { version = "1.1.5", features = ["process"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }
tempfile = "3.27.0"
ignore = "0.4.33"
notify = "8.2.0"
trash = "5.2.9"
comrak = { version = "0.56", default-features = false }
ammonia = "4.2"
git2 = { version = "0.21.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# App crate: Tauri shell (windows, IPC commands, events, OS integration). Thin: commands adapt core services.
[package]
name = "permark"
description = "A local-first working environment for documents: Markdown and the files around it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# `_lib` suffix: lib + bin of one package must not share a name (cargo#8519, Windows).
name = "permark_lib"

[features]
# Plugin crates join here as features; default = full build.
default = ["plugin-md-family", "plugin-prompt-blocks", "plugin-frontmatter-card", "plugin-highlight", "plugin-math", "plugin-mermaid", "plugin-plantuml", "plugin-media", "plugin-json-view", "plugin-xml-view", "plugin-text-view", "plugin-word-count"]
plugin-md-family = ["dep:permark-plugin-md-family"]
plugin-word-count = ["dep:permark-plugin-word-count"]
plugin-prompt-blocks = ["dep:permark-plugin-prompt-blocks"]
plugin-frontmatter-card = ["dep:permark-plugin-frontmatter-card"]
plugin-highlight = ["dep:permark-plugin-highlight"]
plugin-math = ["dep:permark-plugin-math"]
plugin-mermaid = ["dep:permark-plugin-mermaid"]
plugin-plantuml = ["dep:permark-plugin-plantuml"]
plugin-media = ["dep:permark-plugin-media"]
plugin-json-view = ["dep:permark-plugin-json-view"]
plugin-xml-view = ["dep:permark-plugin-xml-view"]
plugin-text-view = ["dep:permark-plugin-text-view"]
# Microsoft Store build (Store updates the app; distribution slice).
store = []

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
permark-core.workspace = true
permark-plugin-md-family = { workspace = true, optional = true }
permark-plugin-word-count = { workspace = true, optional = true }
permark-plugin-prompt-blocks = { workspace = true, optional = true }
permark-plugin-frontmatter-card = { workspace = true, optional = true }
permark-plugin-highlight = { workspace = true, optional = true }
permark-plugin-math = { workspace = true, optional = true }
permark-plugin-mermaid = { workspace = true, optional = true }
permark-plugin-plantuml = { workspace = true, optional = true }
permark-plugin-media = { workspace = true, optional = true }
permark-plugin-json-view = { workspace = true, optional = true }
permark-plugin-xml-view = { workspace = true, optional = true }
permark-plugin-text-view = { workspace = true, optional = true }
# generate_context! expands to serde_json (plugin config).
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-opener = "2.7"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
