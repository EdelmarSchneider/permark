[package]
name = "permark-plugin-spelling"
description = "PerMark plugin spelling: marks misspelled words while editing, in the languages of the text, from dictionaries the person downloads."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Depends on `permark-core` only.
[dependencies]
permark-core.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
# Hunspell-compatible check + suggest, the same answers on every system (MPL-2.0)
spellbook = "0.4.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
