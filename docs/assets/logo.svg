<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b74f2"/>
      <stop offset="1" stop-color="#3a4fc9"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edff"/>
    </linearGradient>
  </defs>
  <!-- app tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <!-- document page -->
  <rect x="262" y="196" width="500" height="632" rx="56" fill="url(#page)"/>
  <!-- text lines -->
  <rect x="330" y="300" width="250" height="34" rx="17" fill="#c5cdf7"/>
  <rect x="330" y="372" width="364" height="26" rx="13" fill="#dde2fb"/>
  <rect x="330" y="424" width="320" height="26" rx="13" fill="#dde2fb"/>
  <!-- the trail: dotted path ending in a marker -->
  <path d="M352 724 C 420 640, 470 700, 530 620 S 640 560, 668 520"
        fill="none" stroke="#4f6bed" stroke-width="30" stroke-linecap="round" stroke-dasharray="2 58"/>
  <!-- bookmark ribbon (the mark) -->
  <path d="M610 196 h120 v250 l-60 -46 l-60 46 z" fill="#ffb547"/>
  <circle cx="668" cy="520" r="34" fill="#4f6bed"/>
  <circle cx="668" cy="520" r="14" fill="#ffffff"/>
</svg>
