name: permark
title: PerMark
base: core24
adopt-info: permark
summary: Read what your AI writes. Write what it reads. A Markdown app for AI docs.
description: |
  PerMark is a working environment for documents: one place to read, write and organize Markdown and the files that go with it, and to steer AI projects through their documents (plans, specs, notes) with Markdown as the shared language of people and agents.

  Got a .md file?
  - Open any standalone .md file as a clean, well-typeset page—Mermaid diagrams, LaTeX math, tables, and ~190 syntax-highlighted languages.
  - Edit in place visually (WYSIWYG) or in source mode with YAML frontmatter validation.
  - Keep a self-saving scratchpad (Notes) with zero save dialogs.

  Build with AI agents?
  - Open a project folder as a live workspace that watches what your AI agents write across branches and git worktrees.
  - See what changed since you last read (Unread view) with block-level diffs (Added, Rewritten, Removed).
  - Leave inline comments on any passage and let your agent read and resolve them via PerMark's built-in MCP server (permark mcp) or CLI hook (permark context).
  - Works with any AI tool (Claude Code, Codex, Cursor, Gemini CLI, OpenCode, Cline, Aider, Hermes Agent, OpenClaw...) or none.
license: MIT OR Apache-2.0
icon: app/src-tauri/icons/128x128@2x.png
website: https://edelmarschneider.github.io/permark/
source-code: https://github.com/EdelmarSchneider/permark
issues: https://github.com/EdelmarSchneider/permark/issues
contact: https://github.com/EdelmarSchneider/permark/discussions
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:

apps:
  permark:
    command: usr/bin/permark
    desktop: usr/share/applications/PerMark.desktop
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - network
      - network-bind
    environment:
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"

parts:
  permark:
    plugin: nil
    source: .
    build-packages:
      - curl
      - ca-certificates
      - dpkg
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
    override-build: |
      set -eu
      VER=$(grep -oE '"version": *"[^"]+"' "$CRAFT_PART_SRC/app/package.json" | head -n 1 | cut -d'"' -f4)
      DEB_URL="https://github.com/EdelmarSchneider/permark/releases/download/v${VER}/PerMark_${VER}_amd64.deb"
      if ! curl -fsSLI "$DEB_URL" >/dev/null 2>&1; then
        DEB_URL=$(curl -fsSL https://api.github.com/repos/EdelmarSchneider/permark/releases/latest | grep -oE 'https://[^"]+_amd64\.deb' | head -n 1)
        VER=$(echo "$DEB_URL" | sed -E 's#.*/PerMark_([^_]+)_amd64\.deb#\1#')
      fi
      craftctl set version="$VER"
      curl -fsSL "$DEB_URL" -o /tmp/permark.deb
      dpkg-deb -x /tmp/permark.deb "$CRAFT_PART_INSTALL"
      rm -f /tmp/permark.deb
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.png|' "$CRAFT_PART_INSTALL/usr/share/applications/PerMark.desktop"
