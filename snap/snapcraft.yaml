name: permark
title: PerMark
base: core24
adopt-info: permark
summary: A unified document workspace for Markdown and the files around it
description: |
  PerMark is a unified document workspace: one place to read, write and organize Markdown and the files that go with it, and to steer AI projects through their documents (plans, specs, notes, agent instructions). AI speeds the work; your vision steers it.

  Got a .md file?
  - Open it as a clean page: tables, task lists, footnotes, alerts, highlighted code, Mermaid and PlantUML diagrams, math.
  - Edit it visually or as raw source; saving rewrites only what you changed.
  - Keep quick notes that save themselves, with earlier versions kept.

  Build with AI agents?
  - Open a project folder to follow what your agents write: a live feed of changed files, unread markers and a review of each change you can keep or revert.
  - Comment on passages, tag files, search down to the section; config files (TOML, YAML, INI, .env) read as clean sheets.
  - Optional agent connection (MCP), off by default and per project: your agent sees where you are, your comments and the notes you share; it never edits files through PerMark.
  - Works with any AI tool, or with none. No account, nothing collected.
license: MIT OR Apache-2.0
icon: app/src-tauri/icons/128x128@2x.png
website: https://edelmarschneider.github.io/permark/
source-code: https://github.com/EdelmarSchneider/permark
issues: https://github.com/EdelmarSchneider/permark/issues
contact: https://github.com/EdelmarSchneider/permark/discussions
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:

apps:
  permark:
    command: usr/bin/permark
    desktop: usr/share/applications/PerMark.desktop
    extensions: [gnome]
    # Plugs = what the person's documents and the app's own downloads need, nothing more.
    # - home | removable-media: the person's files.
    # - network (outbound only): the two downloads the person starts (token-count plugin: the token vocabulary, asks
    #   first; web pictures a document names, per click | per project). The update check is off inside a snap (the
    #   Store updates it). No `network-bind`: the app listens on no TCP | UDP port (agent connection = stdio + a local
    #   Unix socket in the snap's runtime folder). Checked 2026-10-22 against the code + Cargo.lock (no server crate).
    plugs:
      - home
      - removable-media
      - network
    environment:
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"

parts:
  permark:
    plugin: nil
    source: .
    build-packages:
      - curl
      - ca-certificates
      - dpkg
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
    override-build: |
      set -eu
      VER=$(grep -oE '"version": *"[^"]+"' "$CRAFT_PART_SRC/app/package.json" | head -n 1 | cut -d'"' -f4)
      DEB_URL="https://github.com/EdelmarSchneider/permark/releases/download/v${VER}/PerMark_${VER}_amd64.deb"
      if ! curl -fsSLI "$DEB_URL" >/dev/null 2>&1; then
        DEB_URL=$(curl -fsSL https://api.github.com/repos/EdelmarSchneider/permark/releases/latest | grep -oE 'https://[^"]+_amd64\.deb' | head -n 1)
        VER=$(echo "$DEB_URL" | sed -E 's#.*/PerMark_([^_]+)_amd64\.deb#\1#')
      fi
      craftctl set version="$VER"
      curl -fsSL "$DEB_URL" -o /tmp/permark.deb
      dpkg-deb -x /tmp/permark.deb "$CRAFT_PART_INSTALL"
      rm -f /tmp/permark.deb
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.png|' "$CRAFT_PART_INSTALL/usr/share/applications/PerMark.desktop"
