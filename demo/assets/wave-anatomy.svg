<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a wave</title>
  <desc id="d">A wave over the still-water level, with its crest, trough, wavelength L between two crests, height H from trough to crest, and an arrow for the wave speed c.</desc>
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="go" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/>
    </marker>
  </defs>

  <g font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="15" fill="#64748b">
    <!-- water body -->
    <path d="M40 112 c20.06 -17.85 38.4 -34 60 -34 c21.6 0 39.94 16.15 60 34 c20.06 17.85 38.4 34 60 34 c21.6 0 39.94 -16.15 60 -34 c20.06 -17.85 38.4 -34 60 -34 c21.6 0 39.94 16.15 60 34 c20.06 17.85 38.4 34 60 34 c21.6 0 39.94 -16.15 60 -34 L520 186 L40 186 Z" fill="#0d9488" fill-opacity="0.15" stroke="none"/>

    <!-- still-water level -->
    <line x1="24" y1="112" x2="540" y2="112" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/>
    <text x="28" y="136">still-water level</text>

    <!-- the wave -->
    <path d="M40 112 c20.06 -17.85 38.4 -34 60 -34 c21.6 0 39.94 16.15 60 34 c20.06 17.85 38.4 34 60 34 c21.6 0 39.94 -16.15 60 -34 c20.06 -17.85 38.4 -34 60 -34 c21.6 0 39.94 16.15 60 34 c20.06 17.85 38.4 34 60 34 c21.6 0 39.94 -16.15 60 -34" fill="none" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- crest and trough -->
    <circle cx="100" cy="78" r="4.5" fill="#0d9488"/>
    <circle cx="220" cy="146" r="4.5" fill="#0d9488"/>
    <text x="100" y="68" text-anchor="middle" fill="#0d9488">crest</text>
    <text x="220" y="172" text-anchor="middle" fill="#0d9488">trough</text>

    <!-- wavelength L: crest to crest -->
    <line x1="100" y1="54" x2="100" y2="28" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>
    <line x1="340" y1="70" x2="340" y2="28" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>
    <line x1="106" y1="38" x2="334" y2="38" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="220" y="28" text-anchor="middle">wavelength <tspan font-style="italic">L</tspan></text>

    <!-- height H: trough to crest -->
    <line x1="340" y1="78" x2="586" y2="78" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>
    <line x1="460" y1="146" x2="586" y2="146" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>
    <line x1="566" y1="84" x2="566" y2="140" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="576" y="108">height</text>
    <text x="576" y="128" font-style="italic">H</text>

    <!-- direction of travel -->
    <line x1="430" y1="38" x2="500" y2="38" stroke="#d97706" stroke-width="3" stroke-linecap="round" marker-end="url(#go)"/>
    <text x="466" y="28" text-anchor="middle" fill="#d97706">speed <tspan font-style="italic">c</tspan></text>
  </g>
</svg>
