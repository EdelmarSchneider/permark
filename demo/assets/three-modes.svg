        <rect x="298" y="58" width="22" height="22" rx="5"/>
        <rect x="324" y="58" width="22" height="22" rx="5"/>
        <rect x="350" y="58" width="22" height="22" rx="5"/>
        <rect x="376" y="58" width="22" height="22" rx="5"/>
        <rect x="402" y="58" width="22" height="22" rx="5"/>
      </g>
      <g font-size="14" fill="#64748b" text-anchor="middle">
        <text x="309" y="74" font-weight="700">B</text>
        <text x="335" y="74" font-style="italic">I</text>
        <text x="361" y="74">H</text>
      </g>
      <g stroke="#64748b" stroke-width="2" stroke-linecap="round">
