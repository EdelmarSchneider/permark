      <rect x="58" y="84" width="164" height="6" rx="3" fill="#64748b" fill-opacity="0.45"/>
      <rect x="58" y="96" width="138" height="6" rx="3" fill="#64748b" fill-opacity="0.45"/>
      <rect x="58" y="110" width="164" height="50" rx="6" fill="#0d9488" fill-opacity="0.22"/>
      <path d="M64 156 L100 128 L126 146 L150 132 L216 156 Z" fill="#0d9488" fill-opacity="0.55"/>
      <circle cx="198" cy="124" r="6" fill="#d97706"/>
