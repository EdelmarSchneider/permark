      <rect x="298" y="126" width="150" height="6" rx="3" fill="#64748b" fill-opacity="0.45"/>
      <rect x="298" y="138" width="96" height="6" rx="3" fill="#64748b" fill-opacity="0.45"/>
      <line x1="400" y1="133" x2="400" y2="149" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
      <rect x="340" y="154" width="64" height="14" rx="3" fill="#d97706" fill-opacity="0.3"/>
      <rect x="298" y="158" width="160" height="6" rx="3" fill="#64748b" fill-opacity="0.45"/>
