<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-labelledby="t">
  <title id="t">The same page in three modes: View shows the finished page, Edit adds a caret and a toolbar, Source shows the Markdown text</title>
  <g font-family="sans-serif" font-weight="600">

    <!-- View -->
    <g transform="rotate(-4 140 118)">
      <rect x="40" y="36" width="200" height="164" rx="12" fill="#4f46e5" fill-opacity="0.06" stroke="#64748b" stroke-width="2"/>
