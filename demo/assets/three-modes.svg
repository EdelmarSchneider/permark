        <line x1="381" y1="69" x2="393" y2="69"/>
        <line x1="381" y1="74" x2="393" y2="74"/>
      </g>
      <path d="M407 75 L412 68 L416 72 L419 69 L421 75 Z" fill="#64748b"/>
      <line x1="298" y1="92" x2="462" y2="92" stroke="#64748b" stroke-opacity="0.3" stroke-width="2"/>
