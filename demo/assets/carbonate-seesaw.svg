<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="t d">
  <title id="t">The carbonate seesaw</title>
  <desc id="d">A balance beam carrying carbon dioxide, bicarbonate and carbonate, tipped toward carbon dioxide, over a pH scale from 7.6 to 8.4. Markers show surface-ocean pH around 1850 (8.2) and today (8.1).</desc>
  <defs>
    <linearGradient id="ph" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <marker id="eq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="Inter, system-ui, sans-serif" font-weight="600">
    <!-- fulcrum and beam (tipped 6 degrees toward CO2) -->
    <path d="M320 114 L346 150 L294 150 Z" fill="#64748b" fill-opacity="0.35" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="120" y="108" width="400" height="10" rx="5" fill="#64748b" transform="rotate(-6 320 113)"/>

    <!-- the three species -->
    <circle cx="131" cy="86" r="41" fill="#e11d48" fill-opacity="0.2" stroke="#e11d48" stroke-width="3"/>
    <text x="131" y="93" text-anchor="middle" font-size="21" fill="#e11d48">CO<tspan dy="5" font-size="13">2</tspan></text>

    <circle cx="320" cy="66" r="41" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="3"/>
    <text x="318" y="73" text-anchor="middle" font-size="21" fill="#d97706">HCO<tspan dy="5" font-size="13">3</tspan><tspan dy="-15" font-size="13">−</tspan></text>

    <circle cx="509" cy="46" r="41" fill="#0d9488" fill-opacity="0.2" stroke="#0d9488" stroke-width="3"/>
    <text x="507" y="53" text-anchor="middle" font-size="21" fill="#0d9488">CO<tspan dy="5" font-size="13">3</tspan><tspan dy="-15" font-size="13">2−</tspan></text>

    <!-- equilibrium arrows between neighbors -->
    <g stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none">
      <line x1="196" y1="66" x2="250" y2="60" marker-end="url(#eq)"/>
      <line x1="252" y1="74" x2="198" y2="80" marker-end="url(#eq)"/>
      <line x1="386" y1="46" x2="440" y2="40" marker-end="url(#eq)"/>
      <line x1="442" y1="54" x2="388" y2="60" marker-end="url(#eq)"/>
    </g>

    <!-- pH scale -->
    <rect x="90" y="162" width="460" height="14" rx="7" fill="url(#ph)"/>
    <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
      <line x1="90" y1="180" x2="90" y2="186"/>
      <line x1="205" y1="180" x2="205" y2="186"/>
      <line x1="320" y1="180" x2="320" y2="186"/>
      <line x1="435" y1="180" x2="435" y2="186"/>
      <line x1="550" y1="180" x2="550" y2="186"/>
    </g>
    <g font-size="14" fill="#64748b" text-anchor="middle">
      <text x="90" y="200">7.6</text>
      <text x="205" y="200">7.8</text>
      <text x="320" y="200">8.0</text>
      <text x="435" y="200">8.2</text>
      <text x="550" y="200">8.4</text>
      <text x="320" y="217">pH</text>
    </g>
    <text x="90" y="217" font-size="14" fill="#e11d48">more acidic</text>
    <text x="550" y="217" font-size="14" fill="#0d9488" text-anchor="end">more basic</text>

    <!-- markers: about 1850 and today -->
    <path d="M371 152 L384 152 L377.5 160 Z" fill="#d97706"/>
    <text x="377.5" y="148" text-anchor="middle" font-size="14" fill="#d97706">today</text>
    <path d="M428.5 152 L441.5 152 L435 160 Z" fill="#64748b"/>
    <text x="435" y="148" text-anchor="middle" font-size="14" fill="#64748b">1850</text>
  </g>
</svg>
