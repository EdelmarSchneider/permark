<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-labelledby="t d">
  <title id="t">A pot of moqueca</title>
  <desc id="d">A wide clay pot of fish stew with tomato slices and cilantro, steam rising, a whole tomato on the left and a chili pepper on the right.</desc>

  <!-- steam -->
  <g fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round">
    <path d="M140 96 c-12 -12 12 -22 0 -34 s12 -22 0 -34"/>
    <path d="M180 90 c-12 -12 12 -22 0 -34 s12 -22 0 -34 s12 -18 0 -26"/>
    <path d="M220 96 c-12 -12 12 -22 0 -34 s12 -22 0 -34"/>
  </g>

  <!-- table line -->
  <line x1="24" y1="212" x2="336" y2="212" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- handles -->
  <rect x="34" y="124" width="36" height="16" rx="8" fill="#d97706"/>
  <rect x="290" y="124" width="36" height="16" rx="8" fill="#d97706"/>

  <!-- pot body, shade, rim -->
  <path d="M58 126 C62 178 98 208 180 208 C262 208 298 178 302 126 Z" fill="#d97706"/>
  <path d="M74 170 C96 198 128 208 180 208 C232 208 264 198 286 170 C250 186 110 186 74 170 Z" fill="#64748b" fill-opacity="0.3"/>
  <ellipse cx="180" cy="126" rx="124" ry="22" fill="#d97706"/>
  <ellipse cx="180" cy="126" rx="124" ry="22" fill="none" stroke="#64748b" stroke-opacity="0.35" stroke-width="2"/>

  <!-- broth: dende and coconut -->
  <ellipse cx="180" cy="126" rx="108" ry="15" fill="#e11d48"/>
  <ellipse cx="180" cy="126" rx="108" ry="15" fill="#d97706" fill-opacity="0.5"/>

  <!-- tomato slices -->
  <g>
    <ellipse cx="128" cy="124" rx="15" ry="7" fill="#e11d48" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="190" cy="130" rx="15" ry="7" fill="#e11d48" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="240" cy="121" rx="15" ry="7" fill="#e11d48" stroke="#d97706" stroke-width="2"/>
    <g fill="#d97706">
      <circle cx="123" cy="124" r="1.8"/><circle cx="133" cy="124" r="1.8"/>
      <circle cx="185" cy="130" r="1.8"/><circle cx="195" cy="130" r="1.8"/>
      <circle cx="235" cy="121" r="1.8"/><circle cx="245" cy="121" r="1.8"/>
    </g>
  </g>

  <!-- cilantro leaves -->
  <g fill="#0d9488">
    <ellipse cx="160" cy="119" rx="7" ry="3.5" transform="rotate(-25 160 119)"/>
    <ellipse cx="168" cy="122" rx="7" ry="3.5" transform="rotate(20 168 122)"/>
    <ellipse cx="214" cy="129" rx="7" ry="3.5" transform="rotate(-15 214 129)"/>
    <ellipse cx="222" cy="126" rx="7" ry="3.5" transform="rotate(30 222 126)"/>
    <ellipse cx="102" cy="129" rx="6" ry="3" transform="rotate(10 102 129)"/>
    <ellipse cx="262" cy="130" rx="6" ry="3" transform="rotate(-20 262 130)"/>
  </g>

  <!-- whole tomato, front left -->
  <circle cx="52" cy="194" r="18" fill="#e11d48"/>
  <path d="M52 177 l-7 -4 m7 4 l7 -4 m-7 4 l0 -7" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>

  <!-- chili pepper, front right -->
  <path d="M286 206 C300 210 322 204 330 186 C324 196 306 200 290 196 C282 194 278 204 286 206 Z" fill="#d97706"/>
  <path d="M288 201 c-6 -1 -10 -6 -8 -12" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
</svg>
