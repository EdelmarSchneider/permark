[package]
name = "trailmark"
version = "0.3.0"
description = "A fast, beautiful Markdown IDE that keeps up with your AI agents."
license = "MIT OR Apache-2.0"
repository = "https://github.com/EdelmarSchneider/trailmark"
authors = ["Edelmar Schneider"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "trailmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-opener = "2.7.1"
comrak = { version = "0.56.0", default-features = false }
ammonia = "4.2.3"
notify = "8.2.0"
ignore = "0.4.33"
dunce = "1.0.5"
encoding_rs = "0.8.42"
thiserror = "2.0.21"
toml = "1.1.8"
unicode-normalization = "0.1.25"
git2 = { version = "0.21.0", default-features = false }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
base64 = "0.23.1"
trash = "5.2.9"
rmcp = { version = "3.5.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-util", "macros", "net", "sync", "time"] }
interprocess = { version = "2.4.4", features = ["tokio"] }
dirs = "7.0.0"

# The Windows installer records the language it ran in; the app reads it once, on a first start. The same registry holds
# the file manager entries ("Open with TrailMark"), and the shell is told when they change.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell"] }
winreg = "0.56.0"
# The access list of the agent connection's named pipe is handed to Windows as a wide string.
widestring = "1.2.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "time"] }
