[package]
name = "permark-shell"
# Not released on its own: it ships inside the Microsoft Store package, whose version is the app's.
version = "0.0.0"
description = "The right-click \"Open with PerMark\" entry of the Microsoft Store package: a COM component for File Explorer."
license = "MIT OR Apache-2.0"
repository = "https://github.com/EdelmarSchneider/permark"
authors = ["Edelmar Schneider"]
edition = "2021"
publish = false

# Its own workspace: the program's build (and its release profile, which aborts on a panic) does not reach it, and the
# component has build settings of its own: `build.rs` links the Visual C++ runtime statically (`static_vcruntime`), and
# `[profile.release]` below unwinds on a panic.
[workspace]

[lib]
# `cdylib` is the DLL File Explorer's COM surrogate loads; `rlib` lets the tests use the code directly.
name = "permark_shell"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
static_vcruntime = "3.0.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }
# `#[implement]` expands to paths in this crate.
windows-core = "0.62.2"

[lints.rust]
# A COM component is FFI from end to end. The unsafe code is in a few small, commented places (see `lib.rs`).
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"

# A panic must not take the surrogate (and the menu) down: unwind, so `guarded` can catch it. Small, because it is loaded by
# a system process.
[profile.release]
panic = "unwind"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
